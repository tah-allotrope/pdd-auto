bucket_name: verra-rice-vm0051
description: "Homogeneous bucket: Verra-style VM0051 rice cultivation PDDs (alternate wetting and drying / AWD, dry seeding, methane reduction in paddy rice systems)."
version: 0.1.0
bucket_rules:
  include:
    name_patterns:
      - vcs_.*rice
      - vcs_.*paddy
      - vcs_.*awd
      - vcs_.*wetting.*drying
      - vcs_.*vm0051
      - vcs_.*mekong
    mime_types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/msword
    min_word_count: 500
    methodology_family:
      - VM0051
      - AMS-III.AU
    registry:
      - VCS
      - Verra
    geography:
      - Vietnam
      - India
      - Philippines
      - Thailand
      - Southeast Asia
  exclude:
    name_patterns:
      - draft.*internal
      - note|todo|meeting
      - methodology.*pdf
      - template.*docx
    mime_types:
      - application/vnd.google-apps.folder
      - application/vnd.google-apps.document
      - application/vnd.google-apps.spreadsheet
      - text/plain
      - text/html
notes: >
  Keyword scope: rice, paddy, alternate wetting and drying (AWD), dry
  seeding, methane, CH4, irrigation, VM0051. Populate via
  `pdd-agent fetch-registry --methodology VM0051`.
