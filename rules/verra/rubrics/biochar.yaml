# VVB Desk-Review Rubric — Biochar Family (VM0044)
# Version: 0.1.0
# Family: biochar carbon removal (VM0044)
# quantitative_sections: provisional — defaults to WTE set until a registered
# VM0044 PDD refines which subsections carry quantification for biochar.

version: "0.1.0"
bucket: "verra-vm0044-biochar"
family: "biochar"
methodology_ids:
  - "VM0044"
description: >
  VVB-style rubric for biochar carbon-removal projects under VM0044.
  Scores draft sections with family-appropriate criteria. Critical findings block
  export; advisory findings allow watermarked DRAFT export.

scoring:
  scale: "0-100"
  pass_threshold: 70

quantitative_sections:
  - "1.10"
  - "4.1"
  - "4.2"
  - "4.4"

failure_categories:
  critical:
    description: Hard failures that block export or require expert redraft.
    examples:
      - "Evidence citation does not resolve in the evidence registry."
      - "A quantitative claim contradicts the VM0044 calc engine or ProjectInput."
      - "Unresolved [MISSING] markers in Sections 3-4."
  advisory:
    description: Quality issues that do not block export but are surfaced in the reviewer appendix.
    examples:
      - "Section is shorter than schema guidance suggests."
      - "Methodology-dependent section lacks an explicit methodology citation."
      - "[REVIEW REQUIRED] or [INFERENCE] markers are present and disclosed."

criteria:
  - id: COMPLETENESS
    name: Completeness vs section schema
    category: advisory
    weight: 5
    description: Section contains substantive content aligned with schema guidance and content class.

  - id: EVIDENCE_CITATION_VALIDITY
    name: Evidence-citation validity
    category: critical
    weight: 10
    description: Every cited [E###] ID must exist in the evidence registry.

  - id: METHODOLOGY_CONFORMANCE
    name: Methodology conformance
    category: advisory
    weight: 5
    description: Methodology-dependent sections cite VM0044 methodology, calc engine, registry evidence, or corpus evidence.

  - id: NO_FABRICATED_FACTS
    name: No fabricated facts
    category: critical
    weight: 10
    description: Quantitative claims must match ProjectInput and the VM0044 biochar calc engine results.

  - id: MARKER_HYGIENE
    name: Marker hygiene
    category: advisory
    weight: 5
    description: >
      [MISSING], [REVIEW REQUIRED], and [INFERENCE] markers are used correctly.
      [MISSING] in Sections 3-4 is escalated to critical.

section_overrides:
  - section_prefix: "3"
    missing_marker_category: critical
    reason: Sections 3.x define methodology application; unresolved gaps invalidate the baseline/additionality argument.
  - section_prefix: "4"
    missing_marker_category: critical
    reason: Sections 4.x contain quantification; unresolved gaps block credit calculation.
